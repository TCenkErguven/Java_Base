version: '3.1'



services:
  db:
    container_name: postgres
    image: postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: 1234
      PGDATA: /data/java_base
  redis:
    image: redis
    ports:
      - 6379:6379
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - 5540:5540
