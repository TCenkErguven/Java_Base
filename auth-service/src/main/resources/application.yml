server:
  port: 9090

spring:
  security:
    enable-csrf: false
  session:
    redis:
      host: localhost
      port: 6379
      repository-type: indexed
      namespace: "java_base:auth-application"
  datasource:
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 1234
    url: jdbc:postgresql://localhost:5432/java_base
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

jwt:
  secretkey: secretkey
  audience: audience
  issuer: issuer
