ext {
    versions = [
            springBoot      : "3.3.2",
            springJDBC      : "3.3.5",
            springSecurity  : "6.3.3",
            postgresql      : "42.7.3",
            lombok          : "1.18.30",
            openApi         : "1.6.14",
            mapStruct       : "1.5.3.Final",
            springCloud     : "3.1.5",
            jwt             : "4.3.0",
            crypto          : "6.3.3",
            log4j           : "2.24.1",
            hazelcast       : "5.3.6",
            hazelcastAll    : "4.2.8",
            springRetry     : "2.0.8",
            springAOP       : "3.3.3",
            oracleDB        : "23.3.0.23.09",
    ]

    libs = [
            springBootWeb               : "org.springframework.boot:spring-boot-starter-web:$versions.springBoot",
            springBootJpa               : "org.springframework.boot:spring-boot-starter-data-jpa:$versions.springBoot",
            springBootValidation        : "org.springframework.boot:spring-boot-starter-validation:$versions.springBoot",
            springCrypto                : "org.springframework.security:spring-security-crypto:$versions.crypto",
            springSecurity              : "org.springframework.boot:spring-boot-starter-security:$versions.springBoot",
            springSecurityCore          : "org.springframework.security:spring-security-core:$versions.springSecurity",
            springJDBCStarter           : "org.springframework.boot:spring-boot-starter-jdbc:$versions.springBoot",
            springJDBC                  : "org.springframework.data:spring-data-jdbc:$versions.springJDBC",
            springCache                 : "org.springframework.boot:spring-boot-starter-cache",
            springRetry                 : "org.springframework.retry:spring-retry:$versions.springRetry",
            springAOP                   : "org.springframework.boot:spring-boot-starter-aop:$versions.springAOP",
            //postgres
            postgresql                  : "org.postgresql:postgresql:$versions.postgresql",
            //oracleDB
            oracleDB                    : "com.oracle.database.jdbc.ojdbc11:$versions.oracleDB",
            //lombok
            lombok                      : "org.projectlombok:lombok:$versions.lombok",
            openApi                     : "org.springdoc:springdoc-openapi-ui:$versions.openApi",
            //MapStruct-mapping
            mapStruct                   : "org.mapstruct:mapstruct:$versions.mapStruct",
            mapStructProcessor          : "org.mapstruct:mapstruct-processor:$versions.mapStruct",
            //FeignClient
            javaJWT                     : "com.auth0:java-jwt:$versions.jwt",
            //REDIS
            springBootDataRedis         : "org.springframework.boot:spring-boot-starter-data-redis:$versions.springBoot",
            springBootSessionRedis      : "org.springframework.session:spring-session-data-redis:$versions.springBoot",
            //Log4j
            log4jBom                    : "org.apache.logging.log4j:log4j-bom:$versions.log4j",
            log4jApi                    : "org.apache.logging.log4j:log4j-api:$versions.log4j",
            //Hazelcast
            hazelcast                   : "com.hazelcast:hazelcast:$versions.hazelcast",
            hazelcastAll                : "com.hazelcast:hazelcast-all:$versions.hazelcastAll",
            hazelcastSpring             : "com.hazelcast:hazelcast-spring:$versions.hazelcast",
    ]
}