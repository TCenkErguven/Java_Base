syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.grpc.client.proto";
option java_outer_classname = "DuplicateProto";



message SaveRequest {
  string uuid = 1;
  string message = 2;
}

service Duplicate {
  rpc QueryForMessage(SaveRequest) returns (SaveRequest){}
  rpc SaveMessage(SaveRequest) returns (SaveRequest){}
}
